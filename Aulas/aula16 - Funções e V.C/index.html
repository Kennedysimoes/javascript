<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Analisador de números</h1>
        </header>
        <main>
            <!--Input do numero-->
            <div id="form_elem">
                <!--Campo de inserir número-->
                <label for="num_elem">Número (entre 1 e 100): </label>
                <input type="number" name="num_elem" id="num_elem">
                <!--Botão adicionar-->
                <input type="button" value="Adicionar" id="botao" onclick="adicionar()">
            </div>
            <div id="div_tab">
                <!--tabela branca-->
                <select name="tab_elem" id="tab_elem" size="8">
                    
                </select><br>
                <!--Botao finalizar-->
                <input type="button" value="Finalizar" id="botao2" onclick="limpar()">
            </div>
        </main>
        <footer>
            <p><i>@CursoemVideo</i></p>
        </footer>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
