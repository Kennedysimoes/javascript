<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        body {
            font: normal 18pt arial;
        }

        input {
            font: normal 18pt arial;
            width: 100px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Somando Números</h1>
    <input type="number" name="n1" id="n1"> +
    <input type="number" name="n2" id="n2">
    <input type="button" value="somar" onclick="somador()">
    <div id="result">Resultado</div>
    <script>
        function somador(){
            var txtn1 = window.document.getElementById('n1')
            var txtn2 = window.document.querySelector('#n2')
            var res = window.document.getElementById('result')
            
            var val1 = Number(txtn1.value)
            var val2 = Number(txtn2.value)
            var total = val1 + val2

            res.innerHTML = `A soma entre ${val1} e ${val2} é igual a <strong>${total}</strong>`
        }
    </script>
</body>
</html>
