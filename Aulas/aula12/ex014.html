<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horas do dia</title>
    <style>

        * {
            padding: 0px;
            margin: 0px;
        }
        body{
            background-color: rgb(199, 185, 147);
            color: white;
            font: 18pt normal Arial;
            font-weight: 400;
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            text-align: center;
        }
        main{
            flex: 0 1 auto
        }

        main > h1 {
            padding-top: 35px;
            padding-bottom: 35px;
        }

        main > div#caixa {
            background-color: white;
            color: black;
            text-align: center;
            padding-top: 25px;
            padding-bottom: 25px;
            border-radius: 30px;
            width: 600px;
            box-shadow: 0px 0px 20px #00000061;
        }

        main img{
            padding-top: 20px;
            border-radius: 50%;
            width: 250px;
            height: 250px
        }

        footer{
            margin-top: 20px;
        }

    </style>
</head>
<body id="cor">
    <main>
        <h1>Hora do dia</h1>
        <div id="caixa">
            <p id="frase">Agora são 9 horas</p>
            <img src="imagens/dia.jpg" alt="Imagem de dia" id="imagem_h">
        </div>
    </main>
    <footer>
        <p>@Curso em video</p>
    </footer>
    <script>
        var time = new Date
        var horas = time.getHours()
        var horas = 19

        var frase = window.document.getElementById('frase')
        var cor_fundo= window.document.getElementById('cor')
        var imagem = window.document.getElementById('imagem_h')

        if (horas > 18){
            cor_fundo.style.background = 'rgb(71, 74, 73)'
            frase.innerText = `Agoras são ${horas} horas`
            imagem.src = "imagens/noite.jpg"
        }else if(horas >= 12){
            cor_fundo.style.background = 'rgb(163, 119, 96)'
            frase.innerText = `Agora são ${horas} horas`
            imagem.src = "imagens/tarde.jpg"
        }
    </script>
</body>
</html>
