<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idades</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body{
            font: 18pt normal Arial;
            background-color: rgb(59, 129, 209);
            color: white;
        }
        main{
            display: flex;
            flex-flow: column nowrap;
            justify-content: center;
            align-items: center;
        }

        main > h1{
            padding-top: 20px;
            padding-bottom: 20px;
        }

        main > div#caixa {
            line-height: 50px;
            background-color: white;
            color: black;
            padding: 25px 30px 15px 15px;
            border-radius: 15px;
            width: 55vw;
            max-width: 800px;
            min-width: 500px;
            
        }
        
        div#caixa input#ano_nasc {
            height: 25px;
        }

        div#caixa #botao {
            height: 30px;
            width: 60px;
        }
        #frase_u2 {
            text-align: center;
        }

        #photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            display: block;
            margin: auto;
        }

        #footer{
            margin-top: 20px;
        }

        


    </style>
</head>
<body id="fundo_u">
    
    <main>
        <h1>Verificador de idades</h1>
        <div id="caixa">
            Ano de nascimento: <input type="number" name="ano" id="ano_nasc"><br>

            Sexo: <input type="radio" name="sexo" id="opcao1" value="masculino">
            <label for="opcao1">Masculino</label>
            <input type="radio" name="sexo" id="opcao2" value="feminino">
            <label for="opcao2">Feminino</label><br>

            <input type="button" value="Verificar" id="botao" onclick="analise()">

            <p id="frase_u">Preencha os dados acima para ver o resultado!</p>
        </div>
        <p id="footer"><i>@Curso em Video</i></p>
    </main>

    <script>
        var time = new Date
        var ano = time.getFullYear()
        var frase = window.document.getElementById('frase_u')
        

        function analise(){
            var fundo = window.document.getElementById('fundo_u')
            var idade_elemento = window.document.getElementById('ano_nasc')
            var sexo_u = window.document.querySelector('input[name="sexo"]:checked')

            var foto = window.document.createElement('img')
            foto.setAttribute('id', 'photo')
            foto.setAttribute('src', 'imagens/menino_idoso.jpg')

            if (idade_elemento.value.trim().length != 0 && Number(idade_elemento.value) > 0 && idade_elemento.value <= ano){
                var idade = ano - Number(idade_elemento.value)
                if (sexo_u != null){
                    var sexo_valor = sexo_u.value
                    if(sexo_valor === 'masculino'){
                        var genero = 'homem'
                        frase.innerHTML = `<p id="frase_u2">Detectamos ${genero} com ${idade} anos <br></p>`
                        frase.appendChild(foto) 
                        //Homem bebê
                        if (idade < 3){
                            foto.src = 'imagens/menino_bebe.jpg'
                        //Homem criança    
                        }else if (idade <= 10 ) {
                            foto.src = 'imagens/menino_criança.jpg'
                        //Homem adolescente
                        }else if (idade > 10 && idade <= 18 ){
                            foto.src = 'imagens/menino_adolescente.jpg'
                        //Homem adulto
                        }else if (idade > 18 && idade <= 40){
                            foto.src = 'imagens/menino_adulto.jpg'
                        //Homem idoso
                        }else if (idade > 40 && idade <= 110){
                            foto.src = 'imagens/menino_idoso.jpg'
                        //Homem morto
                        }else{
                            foto.src = 'imagens/morto.jpg'
                        }
                    }else{
                        var genero = 'mulher'
                        frase.innerHTML = `<p id="frase_u2">Detectamos ${genero} com ${idade} anos <br></p>`
                        frase.appendChild(foto) 
                        //Mulher bebê
                        if (idade < 3){
                            foto.src = 'imagens/menina_bebe.jpg'
                        //Mulher criança    
                        }else if (idade <= 10) {
                            foto.src = 'imagens/menina_criança.jpeg'
                        //Mulher adolescente
                        }else if (idade > 10 && idade <= 18 ){
                            foto.src = 'imagens/menina_adolescente.jpg'
                        //Mulher adulto
                        }else if (idade > 18 && idade <= 40){
                            foto.src = 'imagens/menina_adulta.jpg'
                        //Mulher idoso
                        }else if (idade > 40 && idade <= 110){
                            foto.src = 'imagens/menina_idosa.jpg'
                        //Mulher morto
                        }else{
                            foto.src = 'imagens/morto.jpg'
                        }
                        }    
                }else{
                    window.alert('ERRO - ESCOLHA UMA OPÇÃO DE SEXO')
                }
            }else{
                window.alert('ERRO digite um valor válido no Nascimento')
            }
        }
        var c = 10; 
        do {     
            console.log("Isso vai aparecer uma vez!");    
            c++; } 
        while (c < 5); 
        // Resultado: Ele imprime a frase e só depois percebe que 11 não é menor que 5.

    </script>
</body>
</html>
