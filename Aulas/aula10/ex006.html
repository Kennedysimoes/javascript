<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #botao {
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            padding: auto;
            text-align: center;
            line-height: 200px;
        }
    </style>
</head>
<body>
    <div id="botao">
        Clicou
    </div>

    <script>
        q = window.document.getElementById('botao') 

        q.addEventListener('click', clicou)
        q.addEventListener('mouseenter', entrar)
        q.addEventListener('mouseout', sair)

        function clicou() {
            q.innerText = 'Clicou'
            q.style.background = 'blue'
        }

        function entrar() {
            q.innerText = 'Entrou'
        }

        function sair(){
            q.innerText = 'Saiu'
            q.style.background = 'green'
        }
    </script>
</body>
</html>
